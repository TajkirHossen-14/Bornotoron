<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Bornotoron – বাংলা লেখার সহজ পথ</title>
  <desc id="description">A forest-green and silver editorial banner. Bornotoron on the left, and a clean live writing preview on the right: Ami banglay likhchi becomes আমি বাংলায় লিখছি. The uploaded logo remains a separate original asset, not a redrawn illustration.</desc>
  <defs>
    <linearGradient id="forest" x1="0" y1="0" x2="720" y2="500" gradientUnits="userSpaceOnUse"><stop stop-color="#173f2c"/><stop offset="1" stop-color="#236340"/></linearGradient>
    <linearGradient id="silver" x1="650" y1="0" x2="1500" y2="500" gradientUnits="userSpaceOnUse"><stop stop-color="#f4f7f8"/><stop offset="1" stop-color="#dfe7eb"/></linearGradient>
    <pattern id="stitches" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M25 19v12m-6-6h12" stroke="#236340" opacity=".065"/></pattern>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="155%"><feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#122c20" flood-opacity=".12"/></filter>
    <clipPath id="frame"><rect width="1500" height="500" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1500" height="500" fill="url(#silver)"/>
    <rect x="650" width="850" height="500" fill="url(#stitches)"/>
    <path d="M0 0H639C708 158 690 348 639 500H0Z" fill="url(#forest)"/>
    <path d="M-82 395C119 236 403 440 652 244M-80 430C137 274 402 474 663 286" stroke="#80b991" opacity=".13" stroke-width="1.5"/>
    <circle cx="572" cy="28" r="157" stroke="#96c6a3" opacity=".11"/>
    <circle cx="572" cy="28" r="121" stroke="#96c6a3" opacity=".11"/>
    <g font-family="Inter, Arial, sans-serif">
      <circle cx="75" cy="77" r="4" fill="#a9deb8"/>
      <text x="91" y="82" font-size="12" letter-spacing="3.4" font-weight="600" fill="#c3dfcc">YOUR WORDS. YOUR LANGUAGE.</text>
      <text x="68" y="220" font-size="77" letter-spacing="-3.5" font-weight="700" fill="#f5faf6">Bornotoron<tspan fill="#93d4a8">.</tspan></text>
      <text x="73" y="321" font-size="18" fill="#c3d9ca">A little Banglish. A lot more expression.</text>
      <g font-size="10" font-weight="600" letter-spacing="1.8" fill="#d7e9dd">
        <rect x="72" y="382" width="102" height="34" rx="17" stroke="#70947d" stroke-opacity=".65"/><text x="91" y="403">INSTANT</text>
        <rect x="185" y="382" width="106" height="34" rx="17" stroke="#70947d" stroke-opacity=".65"/><text x="203" y="403">PRIVATE</text>
        <rect x="302" y="382" width="181" height="34" rx="17" stroke="#70947d" stroke-opacity=".65"/><text x="321" y="403">MADE FOR YOUR WORDS</text>
      </g>
    </g>
    <text x="73" y="277" font-family="Noto Sans Bengali, Hind Siliguri, sans-serif" font-size="30" font-weight="500" fill="#e5f1e9">বাংলা লেখার সহজ পথ</text>
    <g filter="url(#soft-shadow)">
      <rect x="751" y="68" width="670" height="350" rx="20" fill="#fafcfd" stroke="#ced9dc"/>
      <path d="M752 120H1420" stroke="#e0e6e8"/>
      <g fill="#b6c5c0"><circle cx="781" cy="94" r="4"/><circle cx="797" cy="94" r="4"/><circle cx="813" cy="94" r="4"/></g>
      <text x="1008" y="99" fill="#697a71" font-family="Inter, Arial, sans-serif" font-size="11" letter-spacing="1.3">A SPACE FOR YOUR WORDS</text>
      <text x="786" y="156" fill="#6a7774" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="2">BANGLISH INPUT</text>
      <text x="786" y="205" fill="#293832" font-family="Inter, Arial, sans-serif" font-size="25">Ami banglay likhchi</text>
      <path d="M786 244H1386" stroke="#dce4e3"/>
      <circle cx="1086" cy="244" r="16" fill="#f1f5f4" stroke="#d3ded8"/>
      <path d="M1086 237v14m-5-5 5 5 5-5" stroke="#236340" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="786" y="284" fill="#587564" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="2">BANGLA, IN AN INSTANT</text>
      <text x="786" y="341" fill="#236340" font-family="Noto Sans Bengali, Hind Siliguri, sans-serif" font-size="36" font-weight="500">আমি বাংলায় লিখছি</text>
      <rect x="786" y="374" width="599" height="1" fill="#e3e9e6"/>
      <circle cx="791" cy="395" r="3" fill="#43865b"/>
      <text x="802" y="399" fill="#697a71" font-family="Inter, Arial, sans-serif" font-size="10">Just your browser. Nothing to install.</text>
    </g>
    <text x="969" y="460" fill="#60736b" font-family="Inter, Arial, sans-serif" font-size="10" letter-spacing="2.2">FROM THE WAY YOU SPEAK TO THE SCRIPT YOU LOVE.</text>
  </g>
</svg>
